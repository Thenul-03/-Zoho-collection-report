<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Daily Collection Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #0e1116;
    color: #e6e6e6;
  }
  h1 { font-size: 20px; margin-bottom: 2px; }
  p.sub { color: #888; margin-top: 0; margin-bottom: 24px; font-size: 13px; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; }
  .badge {
    font-size: 12px; padding: 5px 12px; border-radius: 999px; font-weight: 600;
    white-space: nowrap;
  }
  .badge.ok { background: #113322; color: #4ade80; }
  .badge.bad { background: #331414; color: #f87171; }
  .badge.pending { background: #222; color: #999; }

  .panel {
    background: #171b22; border: 1px solid #262c36; border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }

  label { display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #aaa; }
  select, input {
    width: 100%; padding: 9px; font-size: 14px; border: 1px solid #333;
    border-radius: 6px; box-sizing: border-box; background: #0e1116; color: #eee;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  button {
    padding: 10px 18px; font-size: 14px; font-weight: 600; border: none;
    border-radius: 6px; cursor: pointer; margin-top: 16px; margin-right: 8px;
  }
  button.primary { background: #2563eb; color: white; }
  button.primary:hover { background: #1d4ed8; }
  button.secondary { background: #262c36; color: #eee; }
  button.secondary:hover { background: #303743; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #status { margin-top: 10px; font-size: 13px; color: #999; min-height: 18px; }
  #status.error { color: #f87171; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
  th, td { border: 1px solid #262c36; padding: 6px 8px; text-align: left; white-space: nowrap; }
  th { background: #1c212b; position: sticky; top: 0; }
  tbody tr:nth-child(even) { background: #14171d; }
  .num { text-align: right; }
  .tfoot td { font-weight: 700; background: #1c212b; }
  .scroll-wrap { max-height: 420px; overflow: auto; border-radius: 8px; }

  .forget { font-size: 12px; color: #888; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

  <div class="topbar">
    <div>
      <h1>Daily Collection Report</h1>
      <p class="sub">Wycherley International School — pulled live from Zoho Books</p>
    </div>
    <span class="badge pending" id="connBadge">Checking connection…</span>
  </div>

  <div class="panel">
    <div class="row">
      <div>
        <label for="preset">Date Range</label>
        <select id="preset">
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="this_week">This Week</option>
          <option value="this_month">This Month</option>
          <option value="this_year">This Year</option>
          <option value="custom">Custom Range</option>
        </select>
      </div>
      <div id="fromWrap" style="display:none;">
        <label for="from">From</label>
        <input type="date" id="from" />
      </div>
      <div id="toWrap" style="display:none;">
        <label for="to">To</label>
        <input type="date" id="to" />
      </div>
      <div>
        <label for="accessKey">Access Key</label>
        <input type="password" id="accessKey" placeholder="Report access key" />
      </div>
    </div>

    <button class="primary" id="previewBtn">Preview Report</button>
    <button class="secondary" id="downloadBtn">Download Excel</button>
    <span class="forget" id="forgetKey">forget saved key</span>
    <div id="status"></div>
  </div>

  <div class="panel" id="resultsPanel" style="display:none;">
    <div class="scroll-wrap">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>Date</th><th>Receipt No</th><th>Admission No.</th><th>Student Name</th>
            <th>Details</th><th class="num">Cash</th><th class="num">Chq</th>
            <th class="num">CC</th><th class="num">DT</th><th class="num">MY FEES</th><th>Bank</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
        <tfoot id="resultsFoot"></tfoot>
      </table>
    </div>
  </div>

  <script>
    const presetEl = document.getElementById('preset');
    const fromWrap = document.getElementById('fromWrap');
    const toWrap = document.getElementById('toWrap');
    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const keyEl = document.getElementById('accessKey');
    const statusEl = document.getElementById('status');
    const badgeEl = document.getElementById('connBadge');
    const resultsPanel = document.getElementById('resultsPanel');
    const resultsBody = document.getElementById('resultsBody');
    const resultsFoot = document.getElementById('resultsFoot');

    const savedKey = localStorage.getItem('reportAccessKey');
    if (savedKey) keyEl.value = savedKey;

    document.getElementById('forgetKey').addEventListener('click', () => {
      localStorage.removeItem('reportAccessKey');
      keyEl.value = '';
      badgeEl.textContent = 'Checking connection…';
      badgeEl.className = 'badge pending';
    });

    function pad(n) { return String(n).padStart(2, '0'); }
    function toISO(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

    // Mirrors the same presets Zoho's own report filter offers.
    function computeRange(preset) {
      const now = new Date();
      const start = new Date(now);
      const end = new Date(now);

      if (preset === 'today') {
        // start = end = today
      } else if (preset === 'yesterday') {
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
      } else if (preset === 'this_week') {
        const day = start.getDay(); // 0 = Sunday
        start.setDate(start.getDate() - day);
      } else if (preset === 'this_month') {
        start.setDate(1);
      } else if (preset === 'this_year') {
        start.setMonth(0, 1);
      }
      return { from: toISO(start), to: toISO(end) };
    }

    function updateCustomVisibility() {
      const isCustom = presetEl.value === 'custom';
      fromWrap.style.display = isCustom ? 'block' : 'none';
      toWrap.style.display = isCustom ? 'block' : 'none';
      if (isCustom && !fromEl.value) {
        const r = computeRange('today');
        fromEl.value = r.from;
        toEl.value = r.to;
      }
    }
    presetEl.addEventListener('change', updateCustomVisibility);
    updateCustomVisibility();

    function getRange() {
      if (presetEl.value === 'custom') {
        return { from: fromEl.value, to: toEl.value };
      }
      return computeRange(presetEl.value);
    }

    function getKey() {
      const key = keyEl.value.trim();
      if (key) localStorage.setItem('reportAccessKey', key);
      return key;
    }

    async function checkConnection() {
      const key = keyEl.value.trim();
      if (!key) {
        badgeEl.textContent = 'Enter access key';
        badgeEl.className = 'badge pending';
        return;
      }
      badgeEl.textContent = 'Checking connection…';
      badgeEl.className = 'badge pending';
      try {
        const resp = await fetch(`/api/status?key=${encodeURIComponent(key)}`);
        const data = await resp.json();
        if (data.connected) {
          badgeEl.textContent = '● Zoho Connected';
          badgeEl.className = 'badge ok';
        } else {
          badgeEl.textContent = '● Zoho Disconnected';
          badgeEl.className = 'badge bad';
        }
      } catch (e) {
        badgeEl.textContent = '● Zoho Disconnected';
        badgeEl.className = 'badge bad';
      }
    }
    keyEl.addEventListener('change', checkConnection);
    if (savedKey) checkConnection();

    function fmt(n) {
      return n === null || n === undefined ? '*' : Number(n).toLocaleString();
    }

    document.getElementById('previewBtn').addEventListener('click', async () => {
      const key = getKey();
      const { from, to } = getRange();
      if (!key || !from || !to) {
        statusEl.textContent = 'Enter an access key and a valid date range.';
        statusEl.className = 'error';
        return;
      }
      statusEl.textContent = 'Loading preview…';
      statusEl.className = '';
      resultsPanel.style.display = 'none';

      try {
        const resp = await fetch(`/api/preview?key=${encodeURIComponent(key)}&from=${from}&to=${to}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to load preview');

        resultsBody.innerHTML = data.rows.map((r) => `
          <tr>
            <td>${r.date}</td><td>${r.receiptNo}</td><td>${r.admissionNumber || '*'}</td>
            <td>${r.studentName || '*'}</td><td>${r.details || '*'}</td>
            <td class="num">${fmt(r.cash)}</td><td class="num">${fmt(r.chq)}</td>
            <td class="num">${fmt(r.cc)}</td><td class="num">${fmt(r.dt)}</td>
            <td class="num">${fmt(r.myFees)}</td><td>${r.bank}</td>
          </tr>
        `).join('');

        const t = data.totals;
        resultsFoot.innerHTML = `
          <tr class="tfoot">
            <td colspan="5">TOTAL (${data.count} receipts)</td>
            <td class="num">${t.Cash ? t.Cash.toLocaleString() : '-'}</td>
            <td class="num">${t.Chq ? t.Chq.toLocaleString() : '-'}</td>
            <td class="num">${t.CC ? t.CC.toLocaleString() : '-'}</td>
            <td class="num">${t.DT ? t.DT.toLocaleString() : '-'}</td>
            <td class="num">${t['MY FEES'] ? t['MY FEES'].toLocaleString() : '-'}</td>
            <td></td>
          </tr>
        `;

        resultsPanel.style.display = 'block';
        statusEl.textContent = `Loaded ${data.count} receipt(s).`;
      } catch (e) {
        statusEl.textContent = e.message;
        statusEl.className = 'error';
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const key = getKey();
      const { from, to } = getRange();
      if (!key || !from || !to) {
        statusEl.textContent = 'Enter an access key and a valid date range.';
        statusEl.className = 'error';
        return;
      }
      window.location.href = `/api/report?key=${encodeURIComponent(key)}&from=${from}&to=${to}`;
    });
  </script>
</body>
</html>
